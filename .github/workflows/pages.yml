# Publishes PesaOtas to GitHub Pages whenever main is updated.
# It runs the tests first and publishes ONLY the app files listed in
# tools/release-files.js (built by tools/build-site.js) — never tests, docs,
# tools or any other file in the repository. See docs/DEPLOYMENT.md.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the release fingerprints are current
        run: npm run check-release
      - name: Run the tests
        run: npm test
      - name: Build the site (app files only)
        run: npm run build-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
